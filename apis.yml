aid: adfin
name: Adfin
description: >-
  Adfin is a London-based fintech that combines payment collection and
  AI-powered credit control so businesses get paid faster. Its developer
  platform exposes invoicing, payments and credit-control APIs — create and
  activate invoices, issue payment requests with hosted payment pages, set up
  direct-debit mandates, and reconcile payments — plus signed webhooks for
  real-time invoice, mandate and payment events. Authentication is OAuth 2.0
  (client-credentials for platforms, authorization-code for biller
  authorization), with an official Node.js SDK and a first-party MCP server for
  agent-driven invoicing. Adfin is a portfolio company of Index Ventures.
