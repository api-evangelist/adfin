idempotency:
  supported: true
  detail: >-
    Adfin documents idempotent write operations for invoice creation and
    activation (POST /invoices, PUT /invoices/activate) so that create/activate
    calls can be safely retried without duplicating invoices or payment
    collection. Confirmed in the invoice integration guides.
  source: https://developer.adfin.com/products/direct-integration/guides/adfin-core/payment-request-guide.md
pagination:
  supported: true
  detail: >-
    List/collection endpoints (e.g. payment requests, invoices) support
    filtering and pagination per the Adfin Core resource guides.
webhooks:
  supported: true
  detail: >-
    Outbound webhooks with a shared-secret signature and an adfin-webhook-type
    header; retry logic on failed delivery. See asyncapi/adfin-webhooks.yml.
  signature: shared-secret, HMAC signature verification required before processing
error_handling:
